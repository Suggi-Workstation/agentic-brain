name: library-index

# Regenerate derived indexes from freshly fetched main. A rejected push
# triggers a fresh fetch and regeneration, never replay of a stale patch.
# Retries are bounded; an exhausted or otherwise failed run stays failed.

on:
  push:
    branches: [main]
    paths:
      - 'library/**'
      - 'scripts/index-library.py'
      - 'scripts/library-index-publish.py'
      - 'scripts/library-publish.py'
      - 'scripts/tests/test_library*.py'
      - '.github/workflows/library-index.yml'
  workflow_dispatch:

concurrency:
  group: library-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    # Prevent infinite loop: skip if this commit was made by this bot
    if: ${{ !contains(github.event.head_commit.message, 'auto-regenerate indexes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test library publishers
        shell: bash
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_library*.py'

      - name: Regenerate and publish with bounded fresh-state retries
        shell: bash
        run: python3 -B scripts/library-index-publish.py --repo "$GITHUB_WORKSPACE" --attempts 3