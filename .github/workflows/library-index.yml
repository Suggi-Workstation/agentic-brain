name: library-index

# WHAT THIS DOES (plain English):
# Every time a file inside library/ changes on main (new topic written,
# topic modified, topic deleted), this regenerates the master index
# and all 28 per-domain index files from the live filesystem, commits
# if anything changed, and pushes back. The index is always current.
#
# WHY: the old script only ran during audit cycles, so the index rotted
# between audits (173 claimed vs 192 actual). This makes the index
# self-healing -- any library change triggers a regeneration within
# ~30 seconds of the push landing on GitHub.
#
# HOW TO INSTALL: put this file at
# .github/workflows/library-index.yml in the agentic-brain repo.

on:
  push:
    branches: [main]
    paths:
      - 'library/**'
  workflow_dispatch:

concurrency:
  group: library-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    # Prevent infinite loop: skip if this commit was made by this bot
    if: ${{ !contains(github.event.head_commit.message, 'auto-regenerate indexes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate library indexes
        shell: bash
        run: |
          set -uo pipefail
          echo "library-index: regenerating indexes from filesystem..."
          python3 scripts/index-library.py

      - name: Commit and push if changed
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "Library Index Bot"
          git config user.email "library-index@suggi-workspace.dev"
          git add library/index-library.md library/*/index-*.md
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          git commit -m "library: auto-regenerate indexes"
          git push origin main
          echo "library-index: pushed regenerated indexes."